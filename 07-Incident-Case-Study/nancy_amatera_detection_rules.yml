title: Nancy/Amatera — sync_afc1.cmd hidden BAT stager
id: Nancy-Amera-2026-08-25-004
status: test
description: >
  Detects execution of the hidden BAT stager sync_afc1.cmd used by the Nancy/Amatera loader.
  This file was located in the Nancy cache directory and executed via the UpdateService
  scheduled task at every logon.
author: Salvador Janthan
date: 2026/09/02
modified: 2026/09/02
references:
  - https://github.com/A-dexter-janx/Salvadors-lab-/blob/Lab-Portfolio/07-Incident-Case-Study/nancy-amatera/IOCs.md
tags:
  - attack.execution
  - attack.t1059.003
  - nancy-amatera
logsource:
  category: process_creation
  product: windows
detection:
  selection_cmd:
    Image|endswith: '\cmd.exe'
    CommandLine|contains: 'sync_afc1.cmd'
  selection_nancy:
    CommandLine|contains|startswith:
      - 'Caches\\Nancy\\sync_afc1.cmd'
      - 'AppData\\Local\\Microsoft\\Windows\\Caches\\Nancy\\sync_afc1.cmd'
  condition: selection_cmd and selection_nancy
falsepositives:
  - Extremely rare — sync_afc1.cmd is a malware-specific filename. Any execution of this file is suspicious.
level: critical
