title: Nancy/Amatera — Hidden scheduled task UpdateService persistence
id: Nancy-Amera-2026-08-25-003
status: test
description: >
  Detects the hidden scheduled task UpdateService used for persistence by the Nancy/Amatera
  stealer in the 2026-08-25 incident. The task has a logon trigger and executes cmd.exe
  to run sync_afc1.cmd from the Nancy cache directory. This rule can be deployed as a Sigma
  rule (scheduled task creation/modification) or as a scheduled check that queries the task
  registration and alerts on its presence.
author: Salvador Janthan
date: 2026/09/02
modified: 2026/09/02
references:
  - https://github.com/A-dexter-janx/Salvadors-lab-/blob/Lab-Portfolio/07-Incident-Case-Study/nancy-amatera/UpdateService_task.xml
tags:
  - attack.persistence
  - attack.t1053.005
  - nancy-amatera
  - scheduled_task
logsource:
  category: process_creation
  product: windows
detection:
  selection_task:
    CommandLine|contains|all:
      - 'schtasks'
      - '/Create'
      - 'UpdateService'
  selection_sync:
    CommandLine|contains|all:
      - 'UpdateService'
      - 'sync_afc1.cmd'
  selection_nancy_path:
    CommandLine|contains:
      - 'AppData\\Local\\Microsoft\\Windows\\Caches\\Nancy'
      - 'Caches\\Nancy\\sync_afc1.cmd'
  condition: selection_task or (selection_sync and selection_nancy_path)
falsepositives:
  - Legitimate software that creates a task named UpdateService (rare — this exact name plus Nancy path combination is highly suspicious)
  - Tuning: exclude known legitimate UpdateService tasks if any exist in the environment
level: critical
