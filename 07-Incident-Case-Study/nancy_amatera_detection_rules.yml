title: Nancy/Amatera Stealer — EtherHiding C2 via BSC JSON-RPC
id: Nancy-Amera-2026-08-25-001
status: test
description: >
  Detects the EtherHiding C2 pattern used by the Nancy/Amatera stealer incident (2026-08-25).
  The malware retrieves C2 data by calling JSON-RPC eth_call to BSC nodes
  (bsc-dataseed.binance.org) targeting contract 0x328a1fadff154290f0ce1389a4e633698cdfdaa7
  with selector 0x06fdde03. This is an uncommon behavior for legitimate software and strongly
  indicates the Amatera/RenPy loader chain. The rule covers the C2 retrieval phase.
  For full coverage, combine with the execution-stage rules in nancy_amatera_execution.yml.
author: Salvador Janthan
date: 2026/09/02
modified: 2026/09/02
references:
  - https://github.com/A-dexter-janx/Salvadors-lab-/blob/Lab-Portfolio/07-Incident-Case-Study/nancy-amatera/IOCs.md
tags:
  - attack.command_and_control
  - attack.t1102.002
  - attack.t1071.001
  - nancy-amatera
  - etherhiding
logsource:
  category: web_server
  service: aws/cloudwatch
detection:
  selection_eth_call:
    Network.Traffic.Context|contains|all:
      - 'eth_call'
      - '0x328a1fadff154290f0ce1389a4e633698cdfdaa7'
  selection_selector:
    Network.Traffic.Context|contains|all:
      - '0x06fdde03'
  selection_bsc:
    Destination.Address|startswith:
      - 'bsc-dataseed'
      - 'bsc-mainnet'
  condition: selection_eth_call and selection_selector and selection_bsc
falsepositives:
  - Legitimate BSC interaction from a wallet app or dApp (rare on a workstation)
  - Blockchain developer tools querying BSC contracts
level: critical
