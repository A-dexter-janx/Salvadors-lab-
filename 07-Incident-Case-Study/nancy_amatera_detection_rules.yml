title: Nancy/Amatera — Amatera stealer WPA.exe from Nancy cache
id: Nancy-Amera-2026-08-25-005
status: test
description: >
  Detects the Amatera stealer payload executing as WPA.exe from the Nancy cache directory.
  In the 2026-08-25 incident, the final payload stage ran as WPA.exe from
  %LOCALAPPDATA%\Microsoft\Windows\Caches\Nancy.
author: Salvador Janthan
date: 2026/09/02
modified: 2026/09/02
references:
  - https://github.com/A-dexter-janx/Salvadors-lab-/blob/Lab-Portfolio/07-Incident-Case-Study/nancy-amatera/IOCs.md
tags:
  - attack.execution
  - attack.t1059.003
  - nancy-amatera
logsource:
  category: process_creation
  product: windows
detection:
  selection_wpa:
    Image|endswith: '\WPA.exe'
  selection_nancy:
    CommandLine|contains|startswith:
      - 'Caches\\Nancy'
      - 'AppData\\Local\\Microsoft\\Windows\\Caches\\Nancy'
  condition: selection_wpa and selection_nancy
falsepositives:
  - WPA.exe is a legitimate Windows Printer Admin tool in some contexts — combined with the Nancy cache path, this is malware
  - Tuning: flag only when WPA.exe runs from the Nancy cache directory
level: high
