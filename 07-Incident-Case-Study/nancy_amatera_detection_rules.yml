title: Nancy/Amatera — MSBuild LOLBIN with Nancy .csproj execution
id: Nancy-Amera-2026-08-25-002
status: test
description: >
  Detects MSBuild execution of Nancy*.csproj project files — the LOLBIN chain used by the
  RenPy/PavinLoader to Amatera loader in the 2026-08-25 incident. The malware uses MSBuild
  with MSBUILDENABLEALLPROPERTYFUNCTIONS=1 to execute trojanized Nancy.csproj project files
  as a LOLBIN technique (T1559.003). This rule fires on MSBuild processes loading or executing
  Nancy-prefixed project files or targets.
author: Salvador Janthan
date: 2026/09/02
modified: 2026/09/02
references:
  - https://github.com/A-dexter-janx/Salvadors-lab-/blob/Lab-Portfolio/07-Incident-Case-Study/nancy-amatera/IOCs.md
tags:
  - attack.execution
  - attack.t1559.003
  - attack.defense_evasion
  - nancy-amatera
  - lolbin
logsource:
  category: process_creation
  product: windows
detection:
  selection_msbuild:
    Image|endswith|contains:
      - '\MSBuild.exe'
  selection_nancy_csproj:
    CommandLine|contains|all:
      - 'Nancy'
      - '.csproj'
  selection_nancy_targets:
    CommandLine|contains|all:
      - 'Nancy.Compile.targets'
  selection_nancy_dir:
    CommandLine|contains|startswith:
      - 'Caches\\Nancy\\'
      - 'AppData\\Local\\Microsoft\\Windows\\Caches\\Nancy'
  condition: selection_msbuild and (selection_nancy_csproj or selection_nancy_targets or selection_nancy_dir)
falsepositives:
  - Legitimate NancyFX/Nancy project builds — rare on a workstation, more likely on a dev machine
  - Tuning: exclude known dev machines and known legitimate Nancy projects
level: critical
